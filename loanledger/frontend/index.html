<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LoanLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --card: #ffffff;
    --border: #e8e4dd;
    --text: #1a1714;
    --muted: #7c7469;
    --primary: #2a6049;
    --primary-light: #e8f2ed;
    --primary-fg: #ffffff;
    --danger: #c0392b;
    --danger-light: #fdf2f1;
    --pending-color: #b45309;
    --recovered-color: #2a6049;
    --active-bg: #e8f2ed;
    --active-color: #2a6049;
    --completed-bg: #f0f0f0;
    --completed-color: #555;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --radius: 10px;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* Layout */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .main { flex: 1; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

  /* Header */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 40;
    box-shadow: var(--shadow-sm);
  }
  .header-inner {
    height: 56px; display: flex; align-items: center;
    justify-content: space-between; gap: 1rem;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-size: 1.2rem; color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }
  .brand-icon {
    width: 28px; height: 28px; background: var(--primary-light);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    color: var(--primary);
  }
  .desktop-nav { display: flex; gap: 4px; }
  .nav-link {
    padding: 6px 14px; border-radius: 6px; font-size: .875rem;
    font-weight: 500; cursor: pointer; border: none;
    background: transparent; transition: all .15s;
    color: var(--muted); font-family: var(--font-body);
  }
  .nav-link:hover { background: var(--bg); color: var(--text); }
  .nav-link.active { background: var(--primary-light); color: var(--primary); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 7px 16px; border-radius: 8px;
    font-family: var(--font-body); font-size: .875rem; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s; text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: var(--primary-fg); }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--bg); }
  .btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .btn-danger-outline:hover { background: var(--danger-light); border-color: var(--danger); }
  .btn-sm { padding: 5px 12px; font-size: .8125rem; border-radius: 6px; }
  .btn-full { width: 100%; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    background: var(--bg); padding: 1rem;
    text-align: center; font-size: .8125rem; color: var(--muted);
  }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem;
    box-shadow: var(--shadow-sm);
  }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center;
    padding: 2px 10px; border-radius: 20px;
    font-size: .75rem; font-weight: 500; white-space: nowrap;
  }
  .badge-active { background: var(--active-bg); color: var(--active-color); }
  .badge-completed { background: var(--completed-bg); color: var(--completed-color); }

  /* Summary stats row */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
  .stat-label { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .stat-value { font-family: var(--font-display); font-size: 1.35rem; }
  .stat-total { color: var(--text); }
  .stat-pending { color: var(--pending-color); }
  .stat-recovered { color: var(--recovered-color); }

  /* Loans grid */
  .loans-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .loan-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem;
    cursor: pointer; transition: all .18s;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
  }
  .loan-card:hover { box-shadow: var(--shadow-md); border-color: rgba(42,96,73,.25); transform: translateY(-1px); }
  .loan-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .loan-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loan-amount { font-family: var(--font-display); font-size: 1.35rem; margin-bottom: .75rem; }
  .loan-meta { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-bottom: .75rem; }
  .loan-meta-val { color: var(--text); font-weight: 500; display: block; }
  .loan-footer { margin-top: auto; }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 1rem; text-align: center;
  }
  .empty-icon {
    width: 64px; height: 64px; background: var(--primary-light);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin-bottom: 1rem; color: var(--primary);
  }
  .empty-title { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: .25rem; }
  .empty-desc { color: var(--muted); font-size: .875rem; margin-bottom: 1rem; }

  /* Skeleton loader */
  .skeleton { background: #e8e4dd; border-radius: 6px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  /* Page layout */
  .page { padding: 2rem 0; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
  .page-title { font-family: var(--font-display); font-size: 1.6rem; }
  .page-subtitle { color: var(--muted); font-size: .875rem; margin-top: 2px; }

  /* Loan detail */
  .detail-page { max-width: 680px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .875rem; color: var(--muted); cursor: pointer;
    margin-bottom: 1.25rem; transition: color .15s;
    background: none; border: none; font-family: var(--font-body); padding: 0;
  }
  .back-link:hover { color: var(--text); }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .detail-item-label { font-size: .75rem; color: var(--muted); margin-bottom: 2px; }
  .detail-item-val { font-weight: 600; }

  /* Forms */
  .form-group { margin-bottom: 1.25rem; }
  .form-label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 6px; }
  .form-optional { color: var(--muted); font-weight: 400; }
  .form-input {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-family: var(--font-body); font-size: .9375rem;
    color: var(--text); background: var(--card); outline: none;
    transition: border-color .15s;
  }
  .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(42,96,73,.1); }
  textarea.form-input { resize: vertical; min-height: 72px; }
  .form-error { color: var(--danger); font-size: .75rem; margin-top: 4px; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-actions { display: flex; gap: .75rem; padding-top: 4px; }
  .form-actions .btn { flex: 1; }

  /* Section heading */
  .section-title {
    font-family: var(--font-display); font-size: 1rem;
    margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;
  }
  .section-icon { color: var(--primary); }

  /* Repayment history */
  .repayment-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .repayment-item:last-child { border-bottom: none; }
  .repayment-amount { font-weight: 600; font-size: .9375rem; }
  .repayment-note { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .repayment-date { font-size: .75rem; color: var(--muted); }

  /* Modal overlay */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 1rem;
  }
  .modal {
    background: var(--card); border-radius: 12px;
    padding: 1.5rem; max-width: 420px; width: 100%;
    box-shadow: var(--shadow-md);
  }
  .modal-title { font-family: var(--font-display); font-size: 1.15rem; margin-bottom: .5rem; }
  .modal-desc { font-size: .875rem; color: var(--muted); margin-bottom: 1.25rem; line-height: 1.6; }
  .modal-actions { display: flex; gap: .75rem; justify-content: flex-end; }

  /* Toast */
  .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--text); color: #fff; padding: 10px 18px;
    border-radius: 8px; font-size: .875rem; font-weight: 500;
    box-shadow: var(--shadow-md); animation: slideIn .2s ease;
  }
  .toast-error { background: var(--danger); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Mobile */
  @media (max-width: 640px) {
    .desktop-nav { display: none; }
    .stats-grid { grid-template-columns: 1fr; gap: .75rem; }
    .loans-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: repeat(2, 1fr); }
    .form-2col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── API ────────────────────────────────────────────────────────────────────
const API_BASE = 'http://127.0.0.1:8000/api';

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || err.detail || 'Request failed');
  }
  if (res.status === 204) return null;
  return res.json();
}

// ─── Format helpers ──────────────────────────────────────────────────────────
function formatCurrency(n) {
  return '₹' + Number(n).toLocaleString('en-IN');
}
function formatDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[+m - 1]} ${y}`;
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

// ─── Toast ───────────────────────────────────────────────────────────────────
function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type = 'success') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  }, []);
  return { toasts, toast: add };
}

function ToastContainer({ toasts }) {
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast${t.type === 'error' ? ' toast-error' : ''}`}>{t.msg}</div>
      ))}
    </div>
  );
}

// ─── Icons (inline SVG) ──────────────────────────────────────────────────────
const Icon = {
  Banknote: () => (
    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <circle cx="12" cy="12" r="2.5"/>
      <path d="M6 12h.01M18 12h.01"/>
    </svg>
  ),
  Plus: ({ size = 16 }) => (
    <svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  ),
  ArrowLeft: () => (
    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  ),
  Trash: () => (
    <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <path d="M3 6h18M19 6l-1 14H6L5 6M10 6V4h4v2"/>
    </svg>
  ),
};

// ─── Delete Dialog ───────────────────────────────────────────────────────────
function DeleteDialog({ name, onConfirm, onCancel, isDeleting }) {
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3 className="modal-title">Delete this loan?</h3>
        <p className="modal-desc">
          This will permanently delete the loan to <strong>{name}</strong> and all its repayment history. This cannot be undone.
        </p>
        <div className="modal-actions">
          <button className="btn btn-outline btn-sm" onClick={onCancel}>Cancel</button>
          <button
            className="btn btn-sm"
            style={{ background: 'var(--danger)', color: '#fff' }}
            onClick={onConfirm}
            disabled={isDeleting}
          >
            {isDeleting ? 'Deleting…' : 'Delete'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Dashboard ───────────────────────────────────────────────────────────────
function Dashboard({ navigate }) {
  const [loans, setLoans] = useState([]);
  const [isLoading, setIsLoading] = useState(true);

  useEffect(() => {
    setIsLoading(true);
    apiFetch('/loans/')
      .then(setLoans)
      .catch(() => {})
      .finally(() => setIsLoading(false));
  }, []);

  const totalGiven = loans.reduce((s, l) => s + +l.amount_given, 0);
  const totalPending = loans.reduce((s, l) => s + +l.pending_amount, 0);
  const totalRecovered = loans.reduce((s, l) => s + +l.total_returned, 0);

  return (
    <div className="container page">
      <div className="page-header">
        <div>
          <h1 className="page-title">Dashboard</h1>
          <p className="page-subtitle">{loans.length} loan{loans.length !== 1 ? 's' : ''} tracked</p>
        </div>
        <button className="btn btn-primary btn-sm" onClick={() => navigate('new-loan')}>
          <Icon.Plus /> New Loan
        </button>
      </div>

      {loans.length > 0 && (
        <div className="stats-grid">
          <div className="stat-card">
            <p className="stat-label">Total Given</p>
            <p className="stat-value stat-total">{formatCurrency(totalGiven)}</p>
          </div>
          <div className="stat-card">
            <p className="stat-label">Total Pending</p>
            <p className="stat-value stat-pending">{formatCurrency(totalPending)}</p>
          </div>
          <div className="stat-card">
            <p className="stat-label">Total Recovered</p>
            <p className="stat-value stat-recovered">{formatCurrency(totalRecovered)}</p>
          </div>
        </div>
      )}

      {isLoading ? (
        <div className="loans-grid">
          {[1,2,3,4,5,6].map(i => (
            <div key={i} className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div className="skeleton" style={{ height: 16, width: '70%' }} />
              <div className="skeleton" style={{ height: 28, width: '50%' }} />
              <div className="skeleton" style={{ height: 12, width: '100%' }} />
              <div className="skeleton" style={{ height: 32, width: '100%' }} />
            </div>
          ))}
        </div>
      ) : loans.length === 0 ? (
        <div className="empty-state">
          <div className="empty-icon"><Icon.Plus size={32} /></div>
          <h2 className="empty-title">No loans yet</h2>
          <p className="empty-desc">Create your first loan to start tracking repayments.</p>
          <button className="btn btn-primary" onClick={() => navigate('new-loan')}>Create first loan</button>
        </div>
      ) : (
        <div className="loans-grid">
          {loans.map(loan => (
            <div key={loan.id} className="loan-card" onClick={() => navigate('loan-detail', loan.id)}>
              <div className="loan-card-header">
                <span className="loan-name">{loan.given_to}</span>
                <span className={`badge badge-${loan.status}`}>
                  {loan.status === 'active' ? 'Active' : 'Completed'}
                </span>
              </div>
              <p className="loan-amount">{formatCurrency(loan.amount_given)}</p>
              <div className="loan-meta">
                <div>
                  <span>Given date</span>
                  <span className="loan-meta-val">{formatDate(loan.given_date)}</span>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <span>Pending</span>
                  <span className="loan-meta-val">{formatCurrency(loan.pending_amount)}</span>
                </div>
              </div>
              <div className="loan-footer">
                <button className="btn btn-outline btn-sm btn-full" style={{ pointerEvents: 'none' }}>View Details</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── New Loan ─────────────────────────────────────────────────────────────────
function NewLoan({ navigate, toast }) {
  const [form, setForm] = useState({ given_to: '', amount_given: '', given_date: todayISO(), notes: '' });
  const [errors, setErrors] = useState({});
  const [isPending, setIsPending] = useState(false);

  function validate() {
    const e = {};
    if (!form.given_to.trim()) e.given_to = 'Borrower name is required';
    if (!form.amount_given || +form.amount_given <= 0) e.amount_given = 'Enter a valid amount';
    if (!form.given_date) e.given_date = 'Given date is required';
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!validate()) return;
    setIsPending(true);
    try {
      const loan = await apiFetch('/loans/', {
        method: 'POST',
        body: JSON.stringify({ given_to: form.given_to.trim(), amount_given: +form.amount_given, given_date: form.given_date, notes: form.notes.trim() }),
      });
      toast('Loan created successfully');
      navigate('loan-detail', loan.id);
    } catch (err) {
      toast(err.message || 'Failed to create loan. Please try again.', 'error');
    } finally {
      setIsPending(false);
    }
  }

  return (
    <div className="container page">
      <div style={{ maxWidth: 520 }}>
        <div className="page-header" style={{ marginBottom: '1.5rem' }}>
          <div>
            <h1 className="page-title">New Loan</h1>
            <p className="page-subtitle">Record a new loan disbursement</p>
          </div>
        </div>

        <form onSubmit={handleSubmit} className="card" style={{ padding: '1.5rem' }}>
          <div className="form-group">
            <label className="form-label">Borrower Name</label>
            <input className="form-input" placeholder="e.g. Rahul Sharma" value={form.given_to} onChange={e => setForm(f => ({ ...f, given_to: e.target.value }))} />
            {errors.given_to && <p className="form-error">{errors.given_to}</p>}
          </div>

          <div className="form-group">
            <label className="form-label">Loan Amount (₹)</label>
            <input className="form-input" type="number" min="1" placeholder="e.g. 50000" value={form.amount_given} onChange={e => setForm(f => ({ ...f, amount_given: e.target.value }))} />
            {errors.amount_given && <p className="form-error">{errors.amount_given}</p>}
          </div>

          <div className="form-group">
            <label className="form-label">Given Date</label>
            <input className="form-input" type="date" value={form.given_date} onChange={e => setForm(f => ({ ...f, given_date: e.target.value }))} />
            {errors.given_date && <p className="form-error">{errors.given_date}</p>}
          </div>

          <div className="form-group">
            <label className="form-label">Notes <span className="form-optional">(optional)</span></label>
            <textarea className="form-input" placeholder="Any additional details about this loan…" rows={3} value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} />
          </div>

          <div className="form-actions">
            <button type="button" className="btn btn-outline" onClick={() => navigate('dashboard')}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={isPending}>{isPending ? 'Creating…' : 'Create Loan'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── Loan Detail ──────────────────────────────────────────────────────────────
function LoanDetail({ loanId, navigate, toast }) {
  const [loan, setLoan] = useState(null);
  const [repayments, setRepayments] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [repayForm, setRepayForm] = useState({ amount_returned: '', return_date: todayISO(), notes: '' });
  const [repayError, setRepayError] = useState('');
  const [isAdding, setIsAdding] = useState(false);
  const [showDelete, setShowDelete] = useState(false);
  const [isDeleting, setIsDeleting] = useState(false);

  const fetchData = useCallback(() => {
    setIsLoading(true);
    Promise.all([
      apiFetch(`/loans/${loanId}/`),
      apiFetch(`/loans/${loanId}/repayments/`),
    ]).then(([l, r]) => { setLoan(l); setRepayments(r); })
      .catch(() => {})
      .finally(() => setIsLoading(false));
  }, [loanId]);

  useEffect(() => { fetchData(); }, [fetchData]);

  async function handleRepaySubmit(e) {
    e.preventDefault();
    if (!loan) return;
    const amount = +repayForm.amount_returned;
    if (!amount || amount <= 0) { setRepayError('Enter a valid amount'); return; }
    if (amount > +loan.pending_amount) {
      setRepayError(`Amount cannot exceed pending ₹${Number(loan.pending_amount).toLocaleString('en-IN')}`);
      return;
    }
    setRepayError('');
    setIsAdding(true);
    try {
      await apiFetch(`/loans/${loanId}/repayments/`, {
        method: 'POST',
        body: JSON.stringify({ amount_returned: amount, return_date: repayForm.return_date, notes: repayForm.notes }),
      });
      toast('Repayment recorded');
      setRepayForm({ amount_returned: '', return_date: todayISO(), notes: '' });
      fetchData();
    } catch (err) {
      toast(err.message || 'Failed to record repayment', 'error');
    } finally {
      setIsAdding(false);
    }
  }

  async function handleDelete() {
    setIsDeleting(true);
    try {
      await apiFetch(`/loans/${loanId}/`, { method: 'DELETE' });
      toast('Loan deleted');
      navigate('dashboard');
    } catch (err) {
      toast(err.message || 'Failed to delete loan', 'error');
      setIsDeleting(false);
    }
  }

  if (isLoading) {
    return (
      <div className="container page">
        <div style={{ maxWidth: 680 }}>
          <div className="skeleton" style={{ height: 20, width: 120, marginBottom: 20 }} />
          <div className="skeleton" style={{ height: 140, marginBottom: 16 }} />
          <div className="skeleton" style={{ height: 200 }} />
        </div>
      </div>
    );
  }

  if (!loan) {
    return (
      <div className="container page" style={{ textAlign: 'center', paddingTop: 60 }}>
        <p style={{ color: 'var(--muted)' }}>Loan not found.</p>
        <button className="btn btn-outline btn-sm" style={{ marginTop: 16 }} onClick={() => navigate('dashboard')}>Back to Dashboard</button>
      </div>
    );
  }

  return (
    <div className="container page">
      <div className="detail-page">
        <button className="back-link" onClick={() => navigate('dashboard')}>
          <Icon.ArrowLeft /> Back to Dashboard
        </button>

        {/* Summary card */}
        <div className="card" style={{ marginBottom: '1.25rem' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12, marginBottom: '1rem' }}>
            <div>
              <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '1.6rem' }}>{loan.given_to}</h1>
              <p style={{ color: 'var(--muted)', fontSize: '.875rem', marginTop: 2 }}>Loan to {loan.given_to}</p>
            </div>
            <span className={`badge badge-${loan.status}`} style={{ marginTop: 4 }}>
              {loan.status.charAt(0).toUpperCase() + loan.status.slice(1)}
            </span>
          </div>

          <div className="detail-grid" style={{ marginBottom: loan.notes ? '1rem' : 0 }}>
            {[
              { label: 'Amount Given', val: formatCurrency(loan.amount_given) },
              { label: 'Pending', val: formatCurrency(loan.pending_amount) },
              { label: 'Recovered', val: formatCurrency(loan.total_returned) },
            ].map(item => (
              <div key={item.label}>
                <p className="detail-item-label">{item.label}</p>
                <p className="detail-item-val">{item.val}</p>
              </div>
            ))}
          </div>

          {loan.notes && (
            <p style={{ fontSize: '.875rem', color: 'var(--muted)', borderTop: '1px solid var(--border)', paddingTop: '1rem', marginTop: '1rem' }}>
              {loan.notes}
            </p>
          )}

          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '1rem' }}>
            <button className="btn btn-danger-outline btn-sm" onClick={() => setShowDelete(true)}>
              <Icon.Trash /> Delete Loan
            </button>
          </div>
        </div>

        {/* Repayment form */}
        {loan.status !== 'completed' && (
          <div className="card" style={{ marginBottom: '1.25rem' }}>
            <h2 className="section-title">
              <span className="section-icon"><Icon.Plus /></span> Record Repayment
            </h2>
            <form onSubmit={handleRepaySubmit}>
              <div className="form-2col" style={{ marginBottom: '1rem' }}>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label className="form-label">Amount (₹)</label>
                  <input
                    className="form-input" type="number" min="1" max={loan.pending_amount}
                    placeholder="e.g. 5000"
                    value={repayForm.amount_returned}
                    onChange={e => setRepayForm(f => ({ ...f, amount_returned: e.target.value }))}
                  />
                  {repayError && <p className="form-error">{repayError}</p>}
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label className="form-label">Return Date</label>
                  <input
                    className="form-input" type="date"
                    value={repayForm.return_date}
                    onChange={e => setRepayForm(f => ({ ...f, return_date: e.target.value }))}
                  />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Notes <span className="form-optional">(optional)</span></label>
                <textarea
                  className="form-input" rows={2}
                  placeholder="Payment method, reference number…"
                  value={repayForm.notes}
                  onChange={e => setRepayForm(f => ({ ...f, notes: e.target.value }))}
                />
              </div>
              <button type="submit" className="btn btn-primary btn-full" disabled={isAdding}>
                {isAdding ? 'Recording…' : 'Record Repayment'}
              </button>
            </form>
          </div>
        )}

        {/* Repayment history */}
        <div className="card">
          <h2 className="section-title">Repayment History</h2>
          {repayments.length === 0 ? (
            <p style={{ color: 'var(--muted)', fontSize: '.875rem', textAlign: 'center', padding: '1.5rem 0' }}>
              No repayments recorded yet.
            </p>
          ) : (
            <div>
              {repayments.map(rep => (
                <div key={rep.id} className="repayment-item">
                  <div>
                    <p className="repayment-amount">{formatCurrency(rep.amount_returned)}</p>
                    {rep.notes && <p className="repayment-note">{rep.notes}</p>}
                  </div>
                  <p className="repayment-date">{formatDate(rep.return_date)}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {showDelete && (
        <DeleteDialog
          name={loan.given_to}
          onConfirm={handleDelete}
          onCancel={() => setShowDelete(false)}
          isDeleting={isDeleting}
        />
      )}
    </div>
  );
}

// ─── App root ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('dashboard'); // 'dashboard' | 'new-loan' | 'loan-detail'
  const [activeLoanId, setActiveLoanId] = useState(null);
  const { toasts, toast } = useToast();

  function navigate(dest, id = null) {
    setPage(dest);
    if (id !== null) setActiveLoanId(id);
  }

  const currentPage = page === 'loan-detail' ? 'loan-detail' : page;

  return (
    <div className="app">
      <header>
        <div className="container header-inner">
          <div className="brand" onClick={() => navigate('dashboard')}>
            <div className="brand-icon"><Icon.Banknote /></div>
            LoanLedger
          </div>
          <nav className="desktop-nav">
            <button className={`nav-link${currentPage === 'dashboard' ? ' active' : ''}`} onClick={() => navigate('dashboard')}>Dashboard</button>
            <button className={`nav-link${currentPage === 'new-loan' ? ' active' : ''}`} onClick={() => navigate('new-loan')}>New Loan</button>
          </nav>
        </div>
      </header>

      <main className="main">
        {page === 'dashboard' && <Dashboard navigate={navigate} />}
        {page === 'new-loan' && <NewLoan navigate={navigate} toast={toast} />}
        {page === 'loan-detail' && <LoanDetail loanId={activeLoanId} navigate={navigate} toast={toast} />}
      </main>

      <footer>
        <div className="container">© {new Date().getFullYear()} LoanLedger · Django + React</div>
      </footer>

      <ToastContainer toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
